# ENABLE ME: move this file to .github/workflows/release.yml
#   git mv ci/release.yml .github/workflows/release.yml && git commit -m "ci: enable" && git push
# No secrets needed - the built-in GITHUB_TOKEN publishes the release.

name: build-and-release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: rustc --version && cargo --version
      - name: Build release binary
        run: cargo build --release
      - name: Run the app and capture its interface
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x scripts/demo.sh
          ./scripts/demo.sh ./target/release/zono | tee session-${{ matrix.label }}.txt
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/zono.exe "dist/zono-${{ matrix.label }}.exe"
          else
            cp target/release/zono "dist/zono-${{ matrix.label }}"
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: zono-${{ matrix.label }}
          path: dist/*

  release:
    name: publish release
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -l dist
      - name: Publish v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1.0 --yes --cleanup-tag || true
          gh release create v0.1.0 dist/* --title "zono v0.1.0" --notes "First release of zono, a zero-dependency cross-platform todo list written in Rust. Prebuilt binaries for Linux x86_64, macOS arm64 and Windows x86_64."
